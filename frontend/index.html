<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="/manifest.json"><title>Dickson Bot V8 Scanner</title><style>
:root{--bg:#06101c;--card:#0d1928;--card2:#101f31;--line:#20334b;--text:#e8f0f8;--muted:#8da0b5;--green:#36d399;--red:#fb7185;--yellow:#fbbf24;--blue:#60a5fa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101c,#081321 55%,#06101c);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#0b1726;color:var(--text);border-radius:10px;padding:10px 12px}button.primary{background:#143c55;border-color:#1f617f}button.sim{background:#123d32;border-color:#1e7358;color:#b8ffe5}.wrap{max-width:1200px;margin:auto;padding:14px}.top{position:sticky;top:0;z-index:4;background:rgba(6,16,28,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:-14px -14px 14px;padding:12px 14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.brand{font-size:20px;font-weight:800}.tag{font-size:11px;padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.filters{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:8px;margin:12px 0}select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0b1726;color:var(--text)}.scanner{display:grid;gap:10px}.card{background:rgba(13,25,40,.96);border:1px solid var(--line);border-radius:16px;padding:13px}.scan-head{display:flex;justify-content:space-between;gap:8px}.symbol{font-size:18px;font-weight:800}.dir.buy{color:var(--green)}.dir.sell{color:var(--red)}.dir.neutral{color:var(--muted)}.strength{font-size:11px;border-radius:999px;padding:4px 8px;border:1px solid var(--line)}.mtf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.tf{background:#0a1523;border:1px solid var(--line);border-radius:10px;padding:7px;text-align:center}.tf b{display:block;font-size:10px;color:var(--muted)}.bull{color:var(--green)}.bear{color:var(--red)}.neutral{color:#a9b7c7}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.level{background:#0a1523;border-radius:10px;padding:8px}.level span{display:block;font-size:10px;color:var(--muted)}.level b{font-size:13px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.mini{font-size:11px;color:var(--muted)}.reason{margin-top:9px;padding:8px;border-radius:10px;background:#091522;color:#aab9c9;font-size:12px}.empty{text-align:center;padding:30px;color:var(--muted)}.error{border-color:#713044}.login{max-width:420px;margin:12vh auto}.hidden{display:none}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:10}.drawer.open{display:flex}.panel{width:100%;max-height:85vh;overflow:auto;background:#081321;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px}.bot{display:flex;justify-content:space-between;gap:8px;padding:9px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#0a1624}.diag{font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;color:#9eb0c2}.notice{padding:9px;border-radius:10px;background:#102438;color:#a9c8df;font-size:12px;margin:8px 0}@media(min-width:800px){.scanner{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1.2fr 1fr 1fr 1fr auto}}
</style></head><body><div id="login" class="wrap login"><div class="card"><div class="brand">Dickson Bot V8</div><p class="mini">Private SMC research scanner • paper/research only</p><input id="username" placeholder="Username" autocomplete="username" style="width:100%;margin:6px 0;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0b1726;color:white"><input id="password" type="password" placeholder="Passcode" autocomplete="current-password" style="width:100%;margin:6px 0;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0b1726;color:white"><button class="primary" style="width:100%;margin-top:6px" onclick="login()">Sign in</button><p id="loginErr" class="mini"></p></div></div>
<div id="app" class="wrap hidden"><header class="top"><div class="row between"><div><div class="brand">Dickson Bot <span class="tag">V8.0 • PAPER</span></div><div class="mini">SMC Scanner · Daily → 4H → 1H → 15M</div></div><div class="row"><button onclick="refreshScan()">↻ Refresh</button><button onclick="openDiag()">Diagnostics</button><button onclick="logout()">Logout</button></div></div></header>
<div class="notice">No live order execution is included. “SIMULATE” records a paper setup for research and outcome statistics.</div>
<div class="filters"><select id="asset"><option value="ALL">All Assets</option><option>XAUUSD</option><option>XAGUSD</option><option>BTCUSD</option><option>EURUSD</option><option>GBPUSD</option></select><select id="direction"><option>All Directions</option><option>BUY</option><option>SELL</option><option>NEUTRAL</option></select><select id="strength"><option>All Strengths</option><option>STRONG</option><option>MODERATE</option><option>WATCH</option></select><select id="timeframe"><option value="15m">15M</option><option value="1h">1H</option></select><button class="primary" onclick="refreshScan()">Scan</button></div>
<div id="status" class="mini">Ready.</div><div id="scanner" class="scanner"></div><section class="card" style="margin-top:10px"><div class="row between"><b>Paper statistics</b><span class="tag">Empirical only</span></div><div id="stats" class="mini" style="margin-top:8px">Loading…</div></section></div>
<div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()"><div class="panel"><div class="row between"><b id="drawerTitle">Full analysis</b><button onclick="closeDrawer()">Close</button></div><div id="drawerBody"></div></div></div>
<script>
const $=id=>document.getElementById(id);let results=[];
async function api(url,opt={}){let r=await fetch(url,{credentials:'include',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.detail||('HTTP '+r.status));return j}
async function login(){try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});showApp();refreshScan()}catch(e){$('loginErr').textContent=e.message}}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}finally{location.reload()}}
async function boot(){try{let m=await api('/api/auth/me');if(m.authenticated)showApp();else return}catch{return}refreshScan()}
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden') }
function strength(c){if(c.qualified&&c.score>=80)return 'STRONG';if(c.qualified&&c.score>=60)return 'MODERATE';return 'WATCH'}
function stateLabel(v){let s=(v?.state||'INSUFFICIENT');return s==='BULLISH'?'Bull':s==='BEARISH'?'Bear':s==='INSUFFICIENT'?'—':'Neutral'}
function fmt(v){return v==null||Number.isNaN(Number(v))?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:6})}
function card(r,i){let c=r.confluence||{},m=r.mtf?.timeframes||{},s=r.setup,p=r.profitability||{};let st=strength(c),d=c.direction||'NEUTRAL';let rr=s?('1:'+Number(s.rr_tp2||2).toFixed(1)):'—';let rate=p.profitability_probability_percent==null?'—':p.profitability_probability_percent.toFixed(1)+'%';let cls=d==='BUY'?'buy':d==='SELL'?'sell':'neutral';return `<article class="card scan-card" data-direction="${d}" data-strength="${st}"><div class="scan-head"><div><div class="symbol">${r.symbol} <span class="tag">${r.timeframe}</span></div><div class="mini">${c.aligned_bots||0} confluences · ${st}</div></div><div class="dir ${cls}"><b>${d}</b></div></div><div class="mtf">${['1d','4h','1h','15m'].map(tf=>`<div class="tf"><b>${tf.toUpperCase()}</b><span class="${m[tf]?.state==='BULLISH'?'bull':m[tf]?.state==='BEARISH'?'bear':'neutral'}">${stateLabel(m[tf])}</span></div>`).join('')}</div><div class="levels"><div class="level"><span>ENTRY</span><b>${fmt(s?.entry)}</b></div><div class="level"><span>STOP / INVALIDATION</span><b>${fmt(s?.sl)}</b></div><div class="level"><span>TARGET</span><b>${fmt(s?.tp2||s?.tp1)}</b></div></div><div class="meta"><span class="tag">Score ${c.score||0}/100</span><span class="tag">R:R ${rr}</span><span class="tag">Paper rate ${rate}</span><span class="tag">${r.candles} candles</span></div><div class="reason">${escapeHtml((c.bots||[]).filter(x=>x.direction===d).map(x=>x.reason).slice(0,3).join(' · ')||'No aligned setup evidence.')}</div><div class="row" style="margin-top:9px"><button onclick="details(${i})">Full analysis</button>${s?`<button class="sim" onclick="simulate(${i})">SIMULATE</button>`:''}<span class="mini" style="margin-left:auto">${Object.values(r.source||{}).filter(x=>x&&x!=='none').join(', ')||'No source'}</span></div></article>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refreshScan(){let symbols=$('asset').value==='ALL'?['XAUUSD','XAGUSD','BTCUSD','EURUSD','GBPUSD']:[$('asset').value];let tf=$('timeframe').value;$('status').textContent='Loading candles + scanning…';$('scanner').innerHTML='<div class="card empty">Scanning 5 assets across Daily → 4H → 1H → 15M…</div>';try{let x=await api('/api/scanner/scan',{method:'POST',body:JSON.stringify({symbols,timeframe:tf})});results=x.results||[];render();loadStats();$('status').textContent='Updated '+new Date(x.generated_at*1000).toLocaleTimeString()+' • paper/research only'}catch(e){$('scanner').innerHTML='<div class="card empty error">'+escapeHtml(e.message)+'</div>';$('status').textContent='Scanner error — open Diagnostics for provider details.'}}
function render(){let d=$('direction').value,s=$('strength').value;let arr=results.filter(r=>(d==='All Directions'||r.confluence.direction===d)&&(s==='All Strengths'||strength(r.confluence)===s));$('scanner').innerHTML=arr.length?arr.map((r,i)=>card(r,results.indexOf(r))).join(''):'<div class="card empty">No setups match the selected filters.</div>'}
$('direction').onchange=render;$('strength').onchange=render;$('asset').onchange=()=>{};
async function loadStats(){try{let a=await api('/api/paper/statistics');$('stats').textContent=`Setups ${a.total_setups} · Closed ${a.closed} · Wins ${a.wins} · Losses ${a.losses} · Win rate ${a.win_rate_closed_percent??'—'}% · Avg R ${a.avg_r_closed??'—'}`;}catch(e){$('stats').textContent=e.message}}
function details(i){let r=results[i],c=r.confluence,m=r.mtf?.timeframes||{};$('drawerTitle').textContent=r.symbol+' — Full analysis';$('drawerBody').innerHTML='<div class="notice">Paper/research analysis. No live order is sent.</div><h3>MTF</h3>'+['1d','4h','1h','15m'].map(tf=>`<div class="bot"><span>${tf.toUpperCase()}</span><b>${stateLabel(m[tf])}</b></div>`).join('')+'<h3>5-Bot confluence</h3>'+c.bots.map(b=>`<div class="bot"><span>${escapeHtml(b.name)}</span><b class="${b.direction==='BUY'?'bull':b.direction==='SELL'?'bear':'neutral'}">${b.direction} ${b.score}</b><small>${escapeHtml(b.reason)}</small></div>`).join('')+'<h3>Paper setup</h3><pre class="diag">'+escapeHtml(JSON.stringify(r.setup||{qualified:false},null,2))+'</pre>';$('drawer').classList.add('open')}
function closeDrawer(){$('drawer').classList.remove('open')}
async function simulate(i){let r=results[i];if(!r.setup)return;try{await api('/api/paper/setup',{method:'POST',body:JSON.stringify({setup_id:r.setup.setup_id,symbol:r.setup.symbol,direction:r.setup.direction,timeframe:r.setup.timeframe,entry:r.setup.entry,sl:r.setup.sl,tp1:r.setup.tp1,tp2:r.setup.tp2,tp3:r.setup.tp3,score:r.setup.score,taken:false,outcome:'OPEN',r_multiple:0,mfe:0,mae:0})});$('status').textContent='Paper setup recorded: '+r.setup.setup_id;loadStats()}catch(e){alert(e.message)}}
async function openDiag(){try{let d=await api('/api/diagnostics');$('drawerTitle').textContent='System diagnostics';$('drawerBody').innerHTML='<div class="diag">'+escapeHtml(JSON.stringify(d,null,2))+'</div>';$('drawer').classList.add('open')}catch(e){alert(e.message)}}
boot();
</script></body></html>
