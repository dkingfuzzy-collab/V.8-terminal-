services:
  - type: web
    name: dickson-bot-v8
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m compileall -q backend
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        value: owner
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TWELVE_DATA_API_KEY
        sync: false
